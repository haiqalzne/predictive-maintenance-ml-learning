name: Learning checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Source and tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements/constraints-py312.txt
      - name: Install reviewed source environment
        run: |
          python -m pip install "pip==26.2.1"
          python -m pip install -c requirements/constraints-py312.txt -e ".[dev]"
      - name: Check dependencies
        run: python -m pip check
      - name: Check style
        run: |
          python -m ruff check .
          python -m ruff format --check .
      - name: Run offline tests (no bundled model)
        env:
          MPLCONFIGDIR: ${{ runner.temp }}/matplotlib
        run: python -m pytest -q
